version: '3.8'

services:
  quickcash-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: quickcash-web
    restart: always
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://quickcash.jghermanos.xyz}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    networks:
      - quickcash-network
      - supabase-network

networks:
  quickcash-network:
    name: quickcash_quickcash-network
    external: true
  supabase-network:
    name: supabase_default
    external: true
