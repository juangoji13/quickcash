<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#34495E"/>
      <stop offset="55%" stop-color="#2C3E50"/>
      <stop offset="100%" stop-color="#141E28"/>
    </radialGradient>

    <!-- Golden Yellow Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="40%" stop-color="#F1C40F"/>
      <stop offset="100%" stop-color="#D4AC0D"/>
    </linearGradient>

    <!-- Metallic Steel Gradient -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shadow for icon -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>

  <!-- Golden Accent Outer Border -->
  <rect x="12" y="12" width="488" height="488" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Subtle Radial Glow Behind Emblem -->
  <circle cx="256" cy="205" r="140" fill="#F1C40F" opacity="0.08" filter="url(#glow)"/>

  <!-- Group Emblem with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Stylized Modern "Q" Ring -->
    <!-- Heavy Circular Path with Angled Cut -->
    <path d="M 256 70
             C 336 70, 395 128, 395 208
             C 395 288, 336 346, 256 346
             C 176 346, 117 288, 117 208
             C 117 128, 176 70, 256 70 Z
             M 256 128
             C 208 128, 173 164, 173 208
             C 173 252, 208 288, 256 288
             C 278 288, 298 280, 313 266
             L 256 208
             L 292 208
             L 333 249
             C 338 236, 341 222, 341 208
             C 341 164, 304 128, 256 128 Z"
          fill="url(#steelGrad)"/>

    <!-- Dynamic Lightning / Fast Cash Bolt piercing through Q -->
    <path d="M 280 95
             L 210 215
             L 262 215
             L 225 325
             L 330 190
             L 272 190
             Z"
          fill="url(#goldGrad)"
          stroke="#141E28"
          stroke-width="5"
          stroke-linejoin="round"/>

    <!-- Lightning Flare Accent -->
    <circle cx="280" cy="98" r="5" fill="#FFFFFF"/>
  </g>

  <!-- QuickCash Typography Badge -->
  <!-- "Quick" in White, "Cash" in Safety Yellow -->
  <g filter="url(#dropShadow)" text-anchor="middle">
    <text x="256" y="420"
          font-family="Rubik, 'Segoe UI', system-ui, -apple-system, sans-serif"
          font-weight="900"
          font-size="64"
          letter-spacing="-1.5">
      <tspan fill="#FFFFFF">Quick</tspan><tspan fill="url(#goldGrad)">Cash</tspan>
    </text>
  </g>

  <!-- Sleek Golden Anchor Pill -->
  <rect x="176" y="445" width="160" height="6" rx="3" fill="url(#goldGrad)" opacity="0.9"/>
</svg>